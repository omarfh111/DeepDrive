{% load static %}
<div class="app-sidebar-menu">
  <div class="h-100" data-simplebar>
    <div id="sidebar-menu">
      <div class="logo-box">
        <a class="logo logo-light">
          <span class="logo-sm">
            <img
              src="{% static 'admin_themes/assets/images/logo-sm.png' %}"
              alt=""
              height="22"
            />
          </span>
          <span class="logo-lg">
            <img
              src="{% static 'admin_themes/assets/images/logo-light.png' %}"
              alt=""
              height="24"
            />
          </span>
        </a>
        <a class="logo logo-dark">
          <span class="logo-sm">
            <img
              src="{% static 'admin_themes/assets/images/logo-sm.png' %}"
              alt=""
              height="22"
            />
          </span>
          <span class="logo-lg">
            <img
              src="{% static 'admin_themes/assets/images/logo-dark.png' %}"
              alt=""
              height="24"
            />
          </span>
        </a>
      </div>

      <ul id="side-menu">
        <li class="menu-title">Dashboard</li>

        <!-- Dashboard -->
        <li>
          <a class="tp-link" href="{% url 'reviews:reviews_dashboard' %}">
            <span class="nav-icon">
              <iconify-icon icon="solar:graph-up-bold-duotone"></iconify-icon>
            </span>
            <span> Dashboard </span>
          </a>
        </li>

        <li class="menu-title">Gestion</li>

        <!-- Gestion Reviews (Avis) -->
        <li>
          <a
            class="tp-link"
            href="{% url 'reviews:reviews_backreviews_list' %}"
          >
            <span class="nav-icon">
              <iconify-icon icon="solar:checklist-bold-duotone"></iconify-icon>
            </span>
            <span> Reviews (Avis) </span>
          </a>
        </li>

        <!-- Gestion Commentaires -->
        <li>
          <a
            class="tp-link"
            href="{% url 'reviews:reviews_commentaires_list' %}"
          >
            <span class="nav-icon">
              <iconify-icon
                icon="solar:chat-round-dots-bold-duotone"
              ></iconify-icon>
            </span>
            <span> Commentaires </span>
          </a>
        </li>
      </ul>
    </div>
    <div class="clearfix"></div>
  </div>
</div>
