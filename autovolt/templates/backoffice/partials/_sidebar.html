<script>document.querySelectorAll('.tp-dropdown-toggle').forEach(function(arrow) {
    arrow.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation(); 
        
        const link = this.closest('.tp-link');
        const menuItem = link.parentElement;
        const submenu = link.nextElementSibling;
        const arrowIcon = this.querySelector('iconify-icon');
    
        if (submenu.style.display === 'none' || submenu.style.display === '') {
            submenu.style.display = 'block';
            arrowIcon.setAttribute('icon', 'solar:alt-arrow-up-linear');
        } else {
            submenu.style.display = 'none';
            arrowIcon.setAttribute('icon', 'solar:alt-arrow-down-linear');
        }
        menuItem.classList.toggle('active');
    });
});</script>
