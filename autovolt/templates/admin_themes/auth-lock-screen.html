        <title>Lock Screen | Dusty - Responsive Admin Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A fully featured admin theme which can be used to build CRM, CMS, etc."/>

        <!-- App favicon -->
        <link rel="shortcut icon" href="{% static 'admin_themes/assets/images/favicon.ico' %}">

    <body>

        <!-- Begin page -->
        <div class="account-page">
            <div class="container-fluid p-0">

                <div class="row align-items-center g-0 px-3 py-3 vh-100">
                    <div class="col-xl-5">
                        <div class="row">
                            <div class="col-md-8 mx-auto">

                                <div class="card">
                                    <div class="card-body">
                                        <div class="mb-0 p-0 p-lg-3">

                                            <div class="mb-0 border-0 p-md-4 p-lg-0">
                                                <div class="mb-3 p-0 text-center">
                                                    <div class="auth-brand">
                                                        <a class='logo logo-light' href='index.html'>
                                                            <span class="logo-lg">
                                                                <img src="{% static 'admin_themes/assets/images/logo-light.png' %}" alt="" height="24">
                                                            </span>
                                                        </a>
                                                        <a class='logo logo-dark' href='index.html'>
                                                            <span class="logo-lg">
                                                                <img src="{% static 'admin_themes/assets/images/logo-dark.png' %}" alt="" height="24">
                                                            </span>
                                                        </a>
                                                    </div>
                                                </div>
                                                
                                                <div class="auth-title-section mb-4 text-center">
                                                    <h3 class="text-primary fw-semibold mb-1">Lock Screen</h3>
                                                    <p class="text-muted fs-14 mb-0">Enter your password to unlock the screen!</p>
                                                </div>
        
                                                <div class="mb-0">
                                                    <div class="text-center mb-2"> 
                                                        <img src="{% static 'admin_themes/assets/images/users/user-22.jpg' %}" alt="" class="avatar avatar-lg rounded-circle me-1 border border-2"> 
                                                    </div> 
                                                    <div class="text-center"> 
                                                        <h5 class="mb-0 text-dark fw-medium">Hi, John Keiran</h5>
                                                    </div>
                                                </div>
        
                                                <div class="pt-0">
                                                    <form action="https://zoyothemes.com/dusty/html/index.html" class="my-4">
                                                        <div class="form-group mb-3">
                                                            <label for="password" class="form-label">Password</label>
                                                            <input class="form-control" type="password" id="password" required="" placeholder="Enter your password">
                                                        </div>
        
                                                        <div class="form-check mb-3">
                                                            <input type="checkbox" class="form-check-input" id="checkbox-signin" checked>
                                                            <label class="form-check-label" for="checkbox-signin">Remember me</label>
                                                        </div>
                                                        
                                                        <div class="form-group mb-0 row">
                                                            <div class="col-12">
                                                                <div class="d-grid">
                                                                    <button class="btn btn-primary" type="submit"> Unlock </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </form>
        
                                                    <div class="text-center text-muted">
                                                        <p class="mb-0">Try unlock with ?<a class="text-primary fw-medium" href="javascript:void(0);"> Finger print</a> / <a class="text-primary fw-medium" href="javascript:void(0);">Face Id</a></p>

                                                </div>
                                            </div>
                                            
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
