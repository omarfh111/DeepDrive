{% load static %}
<style>
  /* SIDEBAR COMPACTE AVEC DROPDOWN */
  .app-sidebar-menu {
    width: 260px;
    background: linear-gradient(180deg, #1a1a1a 0%, #111111 100%);
    border-right: 1px solid rgba(220, 38, 38, 0.15);
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 1000;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 6px 0 25px rgba(0, 0, 0, 0.3);
  }

  .app-sidebar-menu::-webkit-scrollbar {
    width: 4px;
  }

  .app-sidebar-menu::-webkit-scrollbar-thumb {
    background: rgba(220, 38, 38, 0.4);
    border-radius: 2px;
  }

  LOGO ÉLÉGANT
  .logo-box {
    padding: 22px 20px 18px;
    text-align: center;
    border-bottom: 1px solid rgba(220, 38, 38, 0.25);
    background: rgba(0, 0, 0, 0.5);
    position: relative;
  }

  .logo-box::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #DC2626, transparent);
  }

  .logo-main {
    height: 65px;
    width: auto;
    filter: drop-shadow(0 4px 12px rgba(220, 38, 38, 0.3));
    transition: all 0.3s ease;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    padding: 4px;
  }

  /* .logo-main:hover {
    transform: scale(1.03);
    filter: drop-shadow(0 6px 16px rgba(220, 38, 38, 0.4));
  } */

  /* TITRE MENU */
  .menu-title {
    padding: 12px 20px 6px;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: #DC2626;
    opacity: 0.95;
  }

  /* ITEMS */
  #side-menu {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  #side-menu > li {
    margin-bottom: 1px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    padding: 9px 20px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 600;
    font-size: 12.8px;
    line-height: 1.3;
    transition: all 0.25s ease;
    position: relative;
    border-left: 3px solid transparent;
    text-decoration: none;
  }

  .sidebar-link:hover {
    color: #ffffff;
    background: rgba(220, 38, 38, 0.2);
    border-left-color: #DC2626;
    transform: translateX(4px);
    padding-left: 24px;
  }

  .sidebar-link.active {
    color: #ffffff;
    background: rgba(220, 38, 38, 0.3);
    border-left-color: #DC2626;
    font-weight: 700;
  }

  /* ICÔNES */
  .nav-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    margin-right: 12px;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  .sidebar-link:hover .nav-icon,
  .sidebar-link.active .nav-icon {
    background: #DC2626;
    transform: scale(1.08);
  }

  .nav-icon iconify-icon {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
  }

  .sidebar-link:hover .nav-icon iconify-icon,
  .sidebar-link.active .nav-icon iconify-icon {
    color: #ffffff;
  }

  /* DROPDOWN REVIEWS & COMMENTS */
  .dropdown-parent {
    cursor: pointer;
  }

  .dropdown-parent > .sidebar-link {
    padding-right: 16px;
  }

  .dropdown-arrow {
    margin-left: auto;
    font-size: 12px;
    transition: transform 0.3s ease;
  }

  .dropdown-parent.open .dropdown-arrow iconify-icon {
    transform: rotate(180deg);
  }

  .tp-submenu {
    list-style: none;
    background: rgba(0, 0, 0, 0.3);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, padding 0.35s ease;
    padding: 0;
    margin: 0;
  }

  .dropdown-parent.open .tp-submenu {
    max-height: 200px;
    padding: 4px 0 6px 0;
  }

  .tp-submenu li {
    margin: 0;
  }

  .tp-submenu li a {
    padding: 7px 20px 7px 64px;
    font-size: 12.2px;
    color: rgba(255, 255, 255, 0.68);
    font-weight: 500;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .tp-submenu li a .nav-icon {
    width: 26px;
    height: 26px;
  }

  .tp-submenu li a .nav-icon iconify-icon {
    font-size: 14px;
  }

  .tp-submenu li a:hover {
    color: #ffffff;
    background: rgba(220, 38, 38, 0.15);
    padding-left: 68px;
  }

  .tp-submenu li a.active {
    color: #ffffff;
    font-weight: 650;
    background: rgba(220, 38, 38, 0.25);
  }

  /* LOGOUT */
  .logout-item {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(220, 38, 38, 0.25);
  }

  /* RESPONSIVE */
  @media (max-width: 1200px) {
    .app-sidebar-menu { width: 72px; }
    .logo-main { height: 42px; }
    .logo-box { padding: 16px 12px; }
    .menu-title, .sidebar-link span:not(.nav-icon), .dropdown-arrow { display: none; }
    .nav-icon { margin-right: 0; width: 36px; height: 36px; }
    .sidebar-link { justify-content: center; padding: 12px; }
    .tp-submenu li a { padding: 8px; justify-content: center; }
  }
</style>

<div class="app-sidebar-menu">
  <div class="h-100" data-simplebar>

    <!-- Logo -->
    <div class="logo-box">
      <!-- <a href="/">
        <img src="{% static 'admin_themes/assets/images/deepdrive-removebg.png' %}" 
             alt="DeepDrive" 
             class="logo-main">
      </a> -->


      <a class="logo" href="#"><img src="{% static 'admin_themes/assets/images/deepdrive-removebg.png' %}" alt="Logo" height="100" width="180"></a>
    </div>

    <ul id="side-menu">

      <li class="menu-title">Gestion</li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_partenariats_list' %}active{% endif %}" href="{% url 'deals:admin_partenariats_list' %}">
        <span class="nav-icon"><iconify-icon icon="solar:hand-money-bold-duotone"></iconify-icon></span><span>Partenariats</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_marches' %}active{% endif %}" href="{% url 'deals:admin_marches' %}">
        <span class="nav-icon"><iconify-icon icon="solar:shop-2-bold-duotone"></iconify-icon></span><span>Marchés</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_testdrive_list' %}active{% endif %}" href="{% url 'TestDrive:admin_testdrive_list' %}">
        <span class="nav-icon"><iconify-icon icon="solar:steering-wheel-bold-duotone"></iconify-icon></span><span>Test Drive</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_portfolio' %}active{% endif %}" href="{% url 'posts:admin_portfolio' %}">
        <span class="nav-icon"><iconify-icon icon="solar:notebook-bold-duotone"></iconify-icon></span><span>Postes</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_achats_list' %}active{% endif %}" href="{% url 'achats:admin_achats_list' %}">
        <span class="nav-icon"><iconify-icon icon="solar:cart-large-4-bold-duotone"></iconify-icon></span><span>Achats</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_user_list' or request.resolver_match.url_name == 'admin_user_edit' %}active{% endif %}" href="{% url 'user_app:admin_user_list' %}">
        <span class="nav-icon"><iconify-icon icon="solar:users-group-two-rounded-bold-duotone"></iconify-icon></span><span>Utilisateurs</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'admin_service_list' %}active{% endif %}" href="{% url 'services:admin_service_list' %}">
        <span class="nav-icon"><iconify-icon icon="solar:wrench-bold-duotone"></iconify-icon></span><span>Services</span>
      </a></li>

      <li><a class="sidebar-link {% if request.resolver_match.url_name == 'deep_research_dashboard' %}active{% endif %}" href="{% url 'ai_agent:deep_research_dashboard' %}">
        <span class="nav-icon"><iconify-icon icon="solar:cpu-bolt-bold-duotone"></iconify-icon></span><span>Deep Research AI</span>
      </a></li>

      <li class="menu-title">Reviews</li>

      <!-- DROPDOWN REVIEWS & COMMENTS -->
      <li class="dropdown-parent">
        <div class="sidebar-link">
          <span class="nav-icon"><iconify-icon icon="solar:chat-round-dots-bold-duotone"></iconify-icon></span>
          <span>Reviews & Comments</span>
          <span class="dropdown-arrow">
            <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon>
          </span>
        </div>
        <ul class="tp-submenu">
          <li><a class="sidebar-link {% if request.resolver_match.url_name == 'reviews_backreviews_list' %}active{% endif %}" href="{% url 'reviews:reviews_backreviews_list' %}">
            <span class="nav-icon"><iconify-icon icon="solar:star-bold-duotone"></iconify-icon></span><span>Reviews</span>
          </a></li>
          <li><a class="sidebar-link {% if request.resolver_match.url_name == 'reviews_commentaires_list' %}active{% endif %}" href="{% url 'reviews:reviews_commentaires_list' %}">
            <span class="nav-icon"><iconify-icon icon="solar:chat-line-bold-duotone"></iconify-icon></span><span>Comments</span>
          </a></li>
        </ul>
      </li>

      <li class="menu-title">Système</li>

      <!-- Logout -->
      <li class="logout-item">
        <a class="sidebar-link" href="#" onclick="event.preventDefault();document.getElementById('logout-form').submit();">
          <span class="nav-icon"><iconify-icon icon="solar:logout-3-bold-duotone"></iconify-icon></span><span>Déconnexion</span>
        </a>
        <form id="logout-form" action="{% url 'logout' %}" method="post" style="display:none">{% csrf_token %}</form>
      </li>

    </ul>
  </div>
</div>

<script>
  // Gestion du dropdown
  document.querySelector('.dropdown-parent').addEventListener('click', function(e) {
    this.classList.toggle('open');
  });

  // Ouvrir si un sous-item est actif
  if (document.querySelector('.tp-submenu .sidebar-link.active')) {
    document.querySelector('.dropdown-parent').classList.add('open');
  }
</script>
